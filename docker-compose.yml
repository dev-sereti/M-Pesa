version: "3.9"

services:
  backend:
    build:
      context: ./backend
      target: production
    container_name: mpesa_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:///./data/mpesa_app.db
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - backend_outputs:/app/outputs
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: mpesa_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    security_opt:
      - no-new-privileges:true

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  backend_data:
  backend_uploads:
  backend_outputs: